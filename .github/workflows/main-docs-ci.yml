name: Validate docs

on:
  pull_request:
    paths:
      - projects/docs-web-app/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/main-docs-ci.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Check out the pull request commit
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test docs
        run: pnpm --filter docs-web-app test

      - name: Check docs
        run: pnpm --filter docs-web-app check

      - name: Build docs
        run: pnpm --filter docs-web-app build
