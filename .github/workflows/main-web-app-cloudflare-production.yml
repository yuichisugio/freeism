name: Deploy portal to Cloudflare production

on:
  push:
    branches:
      - main
    paths:
      - projects/main-web-app/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/main-web-app-cloudflare-production.yml

permissions:
  contents: read

concurrency:
  group: freeism-main-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy portal to production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: web-app-production
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out the main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: latest
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test portal
        run: pnpm --filter main-web-app test

      - name: Check portal
        run: pnpm --filter main-web-app check

      - name: Build portal
        run: pnpm --filter main-web-app build

      - name: Deploy portal
        run: pnpm --filter main-web-app deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test portal
        run: pnpm --filter main-web-app smoke:production
