name: Deploy docs to Cloudflare test

on:
  push:
    branches:
      - "test/*"
    paths:
      - projects/docs-web-app/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/main-docs-cloudflare-test.yml

permissions:
  contents: read

concurrency:
  group: freeism-docs-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs to staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: web-app-staging
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test docs
        run: pnpm --filter docs-web-app test

      - name: Check docs
        run: pnpm --filter docs-web-app check

      - name: Build docs
        run: pnpm --filter docs-web-app build

      - name: Deploy docs
        run: pnpm --filter docs-web-app deploy:staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test docs
        run: pnpm --filter docs-web-app smoke:staging
