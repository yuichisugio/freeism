name: オークションステータスをPENDINGからACTIVEに更新_テスト環境

on:
  schedule:
    # 毎日日本時間の00:00に実行 (UTC 15:00)
    - cron: "0 15 * * *"

  # 手動実行用トリガー
  workflow_dispatch:

jobs:
  start-auctions:
    name: オークションステータスをPENDINGからACTIVEに更新_テスト環境
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/web-app

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Restore pnpm cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Run auction start script
        run: pnpm run actions:update-auction-status-to-active
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
