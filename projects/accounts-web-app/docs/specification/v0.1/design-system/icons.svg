<!--
  Freeism Accounts デザインシステム v0.1 のアイコン（SVG スプライト）。
  形は src/frontend/features/app-shell/components/icons.tsx と同じ。id は design-system.ja.html と公開プロフィールの symbol と同じ。
  線のアイコンは currentColor で描き、大きさは使う側の svg 要素の width と height（トークン icon-sm・icon-md）で決める。
  塗りと線は図形ごとに属性で指定し、ページ全体の svg への指定（公開プロフィールの stroke: currentColor など）を受けないようにする。
  ロゴはテーマのトークン（accent・accent-foreground・highlight）を参照する。
  ブランドのロゴはトークン brand-* を参照し、トークンが無いページでも同じ色になるよう、トークンと同じ値をフォールバックに書く。
  GitHub のロゴは currentColor で描く（サービスアイコンの台に載せるときは color をトークン brand-github にする）。
  使い方と id の一覧は README.ja.md を参照。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- ロゴ・ブランド -->
  <symbol id="i-logo" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" stroke="none" style="fill:var(--accent)"/>
    <path d="M9 25 16 7l7 18M11.6 18.5h8.8" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--accent-foreground)"/>
    <circle cx="25" cy="8" r="3.5" stroke="none" style="fill:var(--highlight)"/>
  </symbol>
  <symbol id="i-google" viewBox="0 0 24 24">
    <g fill="none" stroke-width="3.6" stroke-linecap="butt">
      <path d="M17.3 6.7A7.5 7.5 0 0 0 4.95 9.43" style="stroke:var(--brand-google-red, #ea4335)"/>
      <path d="M4.95 9.43a7.5 7.5 0 0 0 0 5.14" style="stroke:var(--brand-google-yellow, #fbbc05)"/>
      <path d="M4.95 14.57A7.5 7.5 0 0 0 17.3 17.3" style="stroke:var(--brand-google-green, #34a853)"/>
      <path d="M17.3 17.3A7.5 7.5 0 0 0 19.5 12H12" style="stroke:var(--brand-google-blue, #4285f4)"/>
    </g>
  </symbol>
  <symbol id="i-github" viewBox="0 0 16 16">
    <path fill="currentColor" stroke="none" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
  </symbol>
  <symbol id="i-orcid" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="11" stroke="none" style="fill:var(--brand-orcid, #a6ce39)"/>
    <rect x="6.6" y="9.6" width="2" height="7.4" rx=".4" stroke="none" style="fill:var(--brand-on, #ffffff)"/>
    <circle cx="7.6" cy="7.3" r="1.25" stroke="none" style="fill:var(--brand-on, #ffffff)"/>
    <path d="M11.2 9.9h2.3a3.55 3.55 0 0 1 0 7.1h-2.3z" fill="none" stroke-width="1.8" stroke-linejoin="round" style="stroke:var(--brand-on, #ffffff)"/>
  </symbol>

  <!-- 操作・状態 -->
  <symbol id="i-person" viewBox="0 0 24 24">
    <circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-help" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="17" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 7.5v5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="16.5" r="1.2" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 11v5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="7.8" r="1.2" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24">
    <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-external" viewBox="0 0 24 24">
    <path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="8" y="8" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-upload" viewBox="0 0 24 24">
    <path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 5v11M7.5 11.5 12 16l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-logout" viewBox="0 0 24 24">
    <path d="M14 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-globe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 12h18M4.5 7.5h15M4.5 16.5h15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
